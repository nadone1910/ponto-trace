<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f19">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Ponto Trace EMEC</title>
<style>
:root{--bg:#0b0f19;--pn:#111827;--bd:#1f2a3d;--tx:#e5e7eb;--mu:#8b97ab;--ac:#22d3ee;--ac2:#0891b2;--ok:#34d399;--wn:#fbbf24;--er:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b0f19;--pn:#111827;--bd:#1f2a3d;--tx:#e5e7eb;--mu:#8b97ab;--ac:#22d3ee;--ac2:#0891b2;--ok:#34d399;--wn:#fbbf24;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
h1,h2,h3{margin:0 0 12px;font-weight:650;letter-spacing:-.01em}h2{font-size:22px}h3{font-size:17px}
.mu{color:var(--mu)}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--pn);border-right:1px solid var(--bd);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{font-size:22px;font-weight:800;padding:4px 10px 16px;letter-spacing:-.02em}.logo b{color:var(--ac)}.logo small{display:block;font-size:11px;font-weight:500;color:var(--mu);letter-spacing:0}
nav button{background:none;border:0;color:var(--mu);text-align:left;padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button:hover{background:var(--bd);color:var(--tx)}nav button.on{background:var(--bd);color:var(--ac);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
.who{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--bd);font-size:13px}
main{padding:24px 28px;min-width:0;max-width:1200px;width:100%}
button,.btn{background:var(--ac2);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.12)}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.s{padding:4px 10px;font-size:13px}button.r{background:transparent;color:var(--er);border:1px solid var(--er)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;font:inherit}
label{display:block;margin-bottom:12px;font-size:13px;color:var(--mu)}label>*{margin-top:4px;color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}.card .n{font-size:30px;font-weight:700;line-height:1.1}.card.ok .n{color:var(--ok)}.card.wn .n{color:var(--wn)}.card.er .n{color:var(--er)}.card.ac .n{color:var(--ac)}
.tw{overflow-x:auto;background:var(--pn);border:1px solid var(--bd);border-radius:10px;margin-bottom:18px}
table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:var(--mu);font-weight:600;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:9px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:last-child td{border-bottom:0}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}.b.ok{color:var(--ok)}.b.wn{color:var(--wn)}.b.er{color:var(--er)}.b.ac{color:var(--ac)}.b.mu{color:var(--mu)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.bar>*{flex:0 1 auto}.bar .grow{flex:1 1 200px}.bar label{margin:0}
.scan{font-size:20px;padding:16px;border:2px solid var(--ac2)}.panel{margin-top:16px;max-width:560px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.acts{display:flex;gap:6px;flex-wrap:nowrap}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:22px;width:min(440px,92vw)}dialog::backdrop{background:rgba(0,0,0,.6)}
.lb{background:#fff;color:#000;text-align:center;padding:12px;border-radius:6px;margin-bottom:8px}.lb b{display:block;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pn);border:1px solid var(--ok);color:var(--tx);padding:10px 18px;border-radius:10px;display:none;z-index:99;max-width:90vw}#toast.e{border-color:var(--er)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .card{padding:24px}.login .logo{font-size:30px;padding:0 0 16px}
pre{white-space:pre-wrap;font-size:12px}

nav{position:sticky;top:0;height:100vh}
.logo{padding:0 4px 16px}.logo img{display:block;width:100%;max-width:180px}.login .logo img{max-width:240px;margin:0 auto}.login .logo small{text-align:center;margin-top:6px}
h2{font-size:26px;margin-bottom:16px}
.card{border-radius:14px}.card.ac .n{color:var(--tx)}.card .n{font-size:36px;font-variant-numeric:tabular-nums}
.tw{border-radius:14px}th{background:rgba(127,140,160,.07);padding:12px}tbody tr:hover{background:rgba(127,140,160,.08)}
button,.btn{border-radius:10px}input,select,textarea{border-radius:10px}input:focus,select:focus{outline:0;border-color:var(--ac)}
.scan{border-radius:14px;font-size:22px;letter-spacing:.04em}
.hint{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;max-width:760px}.hint button{white-space:nowrap}
dialog{border-radius:16px}video{width:100%;border-radius:10px;background:#000}
.mbar,.bk,.cl{display:none}
@media (max-width:760px){
.app{display:block}
.mbar{display:flex;align-items:center;gap:4px;position:sticky;top:0;z-index:20;background:var(--pn);border-bottom:1px solid var(--bd);padding:6px 12px 6px 6px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.hb{background:transparent;border:0;box-shadow:none;color:var(--tx);width:46px;padding:0;display:flex;align-items:center;justify-content:center}
.ml{display:flex;padding:0 6px}.ml img{display:block;height:30px;width:auto;max-width:none}
.mt{margin-left:auto;font-weight:650;font-size:15px;color:var(--mu)}
.bk{display:block;position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.app.open .bk{opacity:1;pointer-events:auto}
nav{position:fixed;top:0;bottom:0;left:0;height:auto;width:min(86vw,340px);z-index:50;flex-direction:column;align-items:stretch;gap:0;overflow-y:auto;transform:translateX(-102%);transition:transform .28s ease;border-right:1px solid var(--bd);border-bottom:0;background:var(--pn);padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px))}
.app.open nav{transform:none}
nav .logo{display:block;padding:0 0 22px}nav .logo img{max-width:170px}
nav .cl{display:block;position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:8px;width:46px;background:transparent;color:var(--tx);box-shadow:none;border:0;font-size:22px;padding:0}
nav>button:not(.cl){font-size:18px;font-weight:600;padding:14px 0;min-height:0;border-bottom:1px solid var(--bd);border-radius:0;color:var(--tx);text-align:left;white-space:normal;flex:none}
nav>button.on{background:none;box-shadow:none;color:var(--ac)}
nav .who{display:block;margin-top:auto;padding-top:22px}
main{padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
h2{font-size:20px}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card .n{font-size:24px}
.bar{flex-direction:column;align-items:stretch}.bar>*,.bar .grow{width:100%;flex:none}
input,select,textarea{font-size:16px}button{min-height:44px}button.s{min-height:38px;padding:6px 12px}
.scan{font-size:18px;padding:14px}.panel{max-width:100%}.hint{flex-direction:column;align-items:stretch}
.tw{background:none;border:0;box-shadow:none;overflow:visible}
table,tbody,tr,td{display:block;width:100%}thead{display:none}
tr{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:8px 14px;margin-bottom:10px}
td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;text-align:right}
td::before{content:attr(data-l);color:var(--mu);font-size:12px;text-align:left;flex:0 0 36%}
td[data-l=""]{justify-content:flex-start;padding-top:8px}td[data-l=""]::before{display:none}
.acts{flex-wrap:wrap}
dialog{width:94vw;max-height:88vh;overflow:auto;padding:16px}
.login{margin:6vh auto}
}
#sheet{display:none}
.lg{display:grid;grid-template-columns:repeat(4,46mm);gap:2mm;justify-content:start}#pv{display:block}
.lab{width:46mm;height:22mm;padding:1mm 1.5mm;border:.2mm dashed #888;background:#fff;color:#000;text-align:center;overflow:hidden;box-sizing:border-box;break-inside:avoid}
.lab.empty{visibility:hidden}.lab b{display:block;font:600 8pt/1.2 Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lab svg{display:block;margin:0 auto}
@media print{@page{size:A4;margin:10mm}body{background:#fff!important}body>*:not(#sheet){display:none!important}#sheet{display:block}}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-weight:400}
h1,h2,h3,.card .n,.mt,nav>button{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
h2{font-size:32px;font-weight:600;text-transform:uppercase;letter-spacing:.01em;line-height:1.1}h3{font-size:21px;font-weight:600;letter-spacing:.01em}
.card .n{font-weight:600;letter-spacing:.01em}
nav>button{font-size:18px;font-weight:500;letter-spacing:.02em}
.mt{font-size:17px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
@media (max-width:760px){
h2{font-size:27px}
nav>button:not(.cl){font-size:23px;font-weight:500;letter-spacing:.01em;padding:12px 0}
.card .n{font-size:30px}
}
</style>
</head>

const V={
dash(){const T=db.tools.filter(t=>t.active),c=s=>T.filter(t=>t.status===s).length;
 const k=[['Ativos',T.length,'ac'],['Disponíveis',c('available'),'ok'],['Emprestadas',c('loaned'),'wn'],['Em manutenção',c('maintenance'),'er'],['Danificadas',T.filter(t=>t.condition==='damaged').length,'er'],['Caixas',db.boxes.filter(b=>b.active).length,'ac']];
 return`<h2>Painel</h2><div class="grid">${k.map(x=>`<div class="card ${x[2]}"><div class="n">${x[1]}</div><div class="mu">${x[0]}</div></div>`).join('')}</div><h3>Últimas movimentações</h3>${tbl(MH,movRows(db.movements.slice(-8)))}`},
move(){return`<h2>Retirada e devolução</h2><div class="hint"><span class="mu">Clique no campo e leia a etiqueta com o leitor USB: ele digita o código e confirma com Enter. Também dá para digitar ou usar a câmera.</span><button type="button" class="g s" onclick="cam()">Ler com a câmera</button></div><input id="sc" class="scan" placeholder="Código da ferramenta, ex.: FER-0001" autocomplete="off" autofocus><div id="mv" class="panel"></div>`},
tools(){const l=db.tools.filter(t=>(t.unique_id+t.name+t.category+t.brand).toLowerCase().includes(q.toLowerCase()));
 return`<h2>Ferramentas</h2><div class="bar"><div class="grow"><input id="qs" placeholder="Buscar por código, nome, categoria ou marca" value="${esc(q)}"></div>${canM()?'<button class="g" onclick="batch()">Imprimir várias etiquetas</button>':''}${isA()?'<button onclick="toolForm()">Nova ferramenta</button>':''}</div>`+tbl(['Código','Nome','Categoria','Marca / modelo','Conservação','Situação','Caixa',''],l.map(t=>[`<b>${t.unique_id}</b>`,esc(t.name)+(t.active?'':' <span class="b mu">inativa</span>'),esc(t.category),esc(t.brand+' '+t.model),bd(t.condition,CO),bd(t.status,ST),esc(by(db.boxes,t.box_id).code),`<div class="acts"><button class="s g" onclick="label('${t.id}')">Etiqueta</button>${isA()?`<button class="s g" onclick="toolForm('${t.id}')">Editar</button><button class="s r" onclick="tog('tools','${t.id}')">${t.active?'Inativar':'Reativar'}</button>`:''}</div>`]))},
boxes(){return`<h2>Caixas</h2>${isA()?'<div class="bar"><button onclick="boxForm()">Nova caixa</button></div>':''}`+tbl(['Código','Nome','Localização','Ferramentas',''],db.boxes.map(b=>{const n=db.tools.filter(t=>t.box_id===b.id&&t.active);return[`<b>${esc(b.code)}</b>`,esc(b.name)+(b.active?'':' <span class="b mu">inativa</span>'),esc(b.location),`${n.length}: <span class="mu">${esc(n.map(t=>t.unique_id).join(', ')||'vazia')}</span>`,isA()?`<div class="acts"><button class="s g" onclick="boxForm('${b.id}')">Editar</button><button class="s r" onclick="tog('boxes','${b.id}')">${b.active?'Inativar':'Reativar'}</button></div>`:'']}))},
emps(){return`<h2>Funcionários</h2>${isA()?'<div class="bar"><button onclick="empForm()">Novo funcionário</button></div>':''}`+tbl(['Matrícula','Nome','Setor','Cargo','Situação',''],db.employees.map(e=>[`<b>${esc(e.registration_code)}</b>`,esc(e.full_name),esc(e.department),esc(e.role),e.active?'<span class="b ok">Ativo</span>':'<span class="b er">Inativo</span>',isA()?`<div class="acts"><button class="s g" onclick="empForm('${e.id}')">Editar</button><button class="s r" onclick="tog('employees','${e.id}')">${e.active?'Inativar':'Reativar'}</button></div>`:'']))},
hist(){const f=db.movements.filter(m=>(!H.emp||m.employee_id===H.emp)&&(!H.from||m.timestamp>=new Date(H.from+'T00:00').getTime())&&(!H.to||m.timestamp<=new Date(H.to+'T23:59:59').getTime()));window._f=f;
 return`<h2>Relatórios</h2><div class="bar"><label>Funcionário<select onchange="H.emp=this.value;render()"><option value="">Todos</option>${db.employees.map(e=>`<option value="${e.id}" ${H.emp===e.id?'selected':''}>${esc(e.full_name)}</option>`).join('')}</select></label><label>De<input type="date" value="${H.from}" onchange="H.from=this.value;render()"></label><label>Até<input type="date" value="${H.to}" onchange="H.to=this.value;render()"></label></div><div class="bar"><button class="g" onclick="exp('inv')">Exportar inventário</button><button class="g" onclick="exp('loan')">Exportar emprestadas</button><button class="g" onclick="exp('mov')">Exportar movimentações</button></div><h3>Emprestadas agora</h3>${tbl(['Ferramenta','Responsável'],db.tools.filter(t=>t.status==='loaned').map(t=>[esc(t.unique_id+' '+t.name),esc(by(db.employees,t.holder).full_name)]))}<h3>Movimentações</h3>${tbl(MH,movRows(f))}`},
users(){return`<h2>Usuários</h2><p class="mu">Quem pode entrar no sistema. Administrador faz tudo, operador faz retiradas e devoluções, consulta só visualiza.</p><div class="bar"><button onclick="userForm()">Novo usuário</button></div>`+tbl(['Usuário','Nome','Perfil','Situação',''],db.users.map(x=>[`<b>${esc(x.username)}</b>`,esc(x.full_name),RO[x.role],x.active?'<span class="b ok">Ativo</span>':'<span class="b er">Inativo</span>',`<div class="acts"><button class="s g" onclick="userForm('${x.id}')">Editar</button>${x.id===me.id?'':`<button class="s r" onclick="tog('users','${x.id}')">${x.active?'Inativar':'Reativar'}</button>`}</div>`]))},
audit(){return`<h2>Trilha de auditoria</h2><p class="mu">Registros não podem ser editados nem excluídos. A busca vale para todo o histórico.</p><div class="bar"><div class="grow"><label>Buscar<input id="aq" placeholder="Usuário, código, ação ou detalhe" value="${esc(AU.q)}" oninput="auS()"></label></div><label>Ação<select id="aa" onchange="auS(1)"><option value="">Todas</option></select></label><label>De<input id="af" type="date" value="${AU.from}" onchange="auS(1)"></label><label>Até<input id="at" type="date" value="${AU.to}" onchange="auS(1)"></label></div><div id="au" class="mu">Carregando…</div>`}};
let AU={q:'',a:'',from:'',to:'',page:1},_at;
async function auditLoad(){const el=$('#au');if(!el)return;const u=new URLSearchParams({q:AU.q,action:AU.a,from:AU.from,to:AU.to,page:AU.page});
 try{const j=await api('/api/audit?'+u);if(view!=='audit')return;$('#aa').innerHTML='<option value="">Todas</option>'+j.actions.map(a=>`<option ${AU.a===a?'selected':''}>${esc(a)}</option>`).join('');
  el.className='';el.innerHTML=`<p class="mu">${j.total} registro(s)${j.total?' · página '+j.page+' de '+j.pages:''}</p>`+tbl(['Data','Usuário','Ação','Alvo','Detalhes'],j.rows.map(a=>[fmt(a.ts),esc(a.username||'—'),`<span class="b ac">${esc(a.action)}</span>`,esc(a.target_entity||''),esc(a.details||'')]))+(j.pages>1?`<div class="bar"><button class="g" ${j.page<=1?'disabled':''} onclick="auP(${j.page-1})">Anterior</button><button class="g" ${j.page>=j.pages?'disabled':''} onclick="auP(${j.page+1})">Próxima</button></div>`:'')}
 catch(x){el.textContent=x.message}}
function auS(now){clearTimeout(_at);AU.q=$('#aq').value;AU.a=$('#aa').value;AU.from=$('#af').value;AU.to=$('#at').value;AU.page=1;if(now)auditLoad();else _at=setTimeout(auditLoad,350)}
function auP(n){AU.page=n;auditLoad();scrollTo(0,0)}
function mn(o){$('.app').classList.toggle('open',!!o);document.body.style.overflow=o?'hidden':''}
function render(){const A=$('#app');document.body.style.overflow='';
 if(!me){A.innerHTML=loginHTML();$('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{username:$('#lu').value.trim(),password:$('#lp').value});await load();view='dash';render()}catch(x){toast(x.message,1)}};return}
 const N=[['dash','Painel'],canM()&&['move','Retirada / devolução'],['tools','Ferramentas'],['boxes','Caixas'],['emps','Funcionários'],['hist','Relatórios'],isA()&&['users','Usuários'],isA()&&['audit','Auditoria']].filter(Boolean);
 A.innerHTML=`<div class="app"><div class="mbar"><button class="hb" aria-label="Abrir menu" onclick="mn(1)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h12"/></svg></button><span class="ml"><picture><img src="${LOGOD}" alt="Ponto Trace"></picture></span><span class="mt">${(N.find(n=>n[0]===view)||[])[1]||''}</span></div><div class="bk" onclick="mn(0)"></div><nav><button class="cl" aria-label="Fechar menu" onclick="mn(0)">✕</button><div class="logo"><picture><img src="${LOGOD}" alt="Ponto Trace"></picture><small>EMEC · almoxarifado</small></div>${N.map(n=>`<button class="${view===n[0]?'on':''}" onclick="view='${n[0]}';render()">${n[1]}</button>`).join('')}<div class="who"><b>${esc(me.full_name)}</b><br><span class="mu">${RO[me.role]}</span><br><button class="s g" style="margin-top:8px" onclick="logout()">Sair</button></div></nav><main>${V[view]()}</main></div>`;
 if(view==='tools')$('#qs').oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const i=$('#qs');i.focus();i.setSelectionRange(p,p)};
 if(view==='move')moveInit();if(view==='audit')auditLoad()}
function moveInit(){const sc=$('#sc'),mv=$('#mv');sc.focus();
 sc.onkeydown=e=>{if(e.key!=='Enter')return;const c=sc.value.trim().toUpperCase();const t=db.tools.find(x=>x.unique_id===c);
  if(!t){mv.innerHTML=`<div class="card"><span class="b er">Não encontrada</span> Nenhuma ferramenta com o código ${esc(c)}.</div>`;sc.select();return}
  const hd=`<div class="card"><h3>${t.unique_id} · ${esc(t.name)}</h3>${bd(t.status,ST)} ${bd(t.condition,CO)} <span class="mu">Caixa ${esc(by(db.boxes,t.box_id).code)}</span></div>`;
  if(t.status==='loaned'){const e=by(db.employees,t.holder);mv.innerHTML=hd+`<div class="card" style="margin-top:10px"><p>Responsável atual: <b>${esc(e.full_name)}</b> (${esc(e.registration_code)})</p><label>Condição na devolução<select id="rc"><option value="good">Boas condições</option><option value="maintenance">Necessita manutenção</option><option value="damaged">Danificada</option></select></label><button onclick="doRet('${t.id}')">Registrar devolução</button></div>`}
  else if(!t.active||t.status!=='available'||t.condition!=='good'){mv.innerHTML=hd+`<div class="card" style="margin-top:10px"><span class="b er">Retirada bloqueada</span> A ferramenta está em manutenção, danificada ou inativa.</div>`}
  else{mv.innerHTML=hd+`<div class="card" style="margin-top:10px"><label>Matrícula do funcionário<input id="em" autocomplete="off" autofocus></label><label>Ordem de serviço ou justificativa<input id="os" autocomplete="off"></label><button onclick="doOut('${t.id}')">Registrar retirada</button></div>`;$('#em').focus();$('#em').onkeydown=x=>{if(x.key==='Enter')$('#os').focus()};$('#os').onkeydown=x=>{if(x.key==='Enter')doOut(t.id)}}}}
function done(m){toast(m);$('#mv').innerHTML='';const s=$('#sc');s.value='';s.focus()}
async function doOut(id){const t=by(db.tools,id);try{const r=await api('/api/move',{action:'withdraw',code:t.unique_id,registration:$('#em').value.trim(),notes:$('#os').value.trim()});await load();done(r.ok)}catch(x){toast(x.message,1)}}
async function doRet(id){const t=by(db.tools,id);try{const r=await api('/api/move',{action:'return',code:t.unique_id,condition:$('#rc').value});await load();done(r.ok)}catch(x){toast(x.message,1)}}
function openForm(title,fs,cb){D.innerHTML=`<form id="ff"><h3>${title}</h3>${fs.map(f=>`<label>${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.k==='password'?'password':'text'}" autocomplete="${f.k==='password'?'new-password':'off'}" value="${esc(f.v||'')}" ${f.r===false?'':'required'}>`}</label>`).join('')}<div class="row"><button type="button" class="g" onclick="D.close()">Cancelar</button><button>Salvar</button></div></form>`;
 $('#ff').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await cb(d);D.close();await load();render()}catch(x){toast(x.message,1)}};D.showModal()}
function toolForm(id){const t=id?by(db.tools,id):{};const bx=db.boxes.filter(b=>b.active||b.id===t.box_id);if(!bx.length)return toast('Cadastre uma caixa antes.',1);
 openForm(id?'Editar ferramenta':'Nova ferramenta',[{k:'name',l:'Nome',v:t.name},{k:'category',l:'Categoria',v:t.category},{k:'brand',l:'Marca',v:t.brand,r:false},{k:'model',l:'Modelo',v:t.model,r:false},{k:'condition',l:'Conservação',v:t.condition||'good',o:Object.entries(CO).map(([k,v])=>[k,v[0]])},{k:'box_id',l:'Caixa',v:t.box_id,o:bx.map(b=>[b.id,b.code+' — '+b.name])}],d=>api('/api/entity',{kind:'tool',id,...d}))}
function boxForm(id){const b=id?by(db.boxes,id):{};openForm(id?'Editar caixa':'Nova caixa',[{k:'code',l:'Código (ex.: CX-004)',v:b.code},{k:'name',l:'Nome',v:b.name},{k:'description',l:'Descrição',v:b.description,r:false},{k:'location',l:'Localização',v:b.location,r:false}],d=>api('/api/entity',{kind:'box',id,...d}))}
function empForm(id){const e=id?by(db.employees,id):{};openForm(id?'Editar funcionário':'Novo funcionário',[{k:'registration_code',l:'Matrícula',v:e.registration_code},{k:'full_name',l:'Nome completo',v:e.full_name},{k:'department',l:'Setor',v:e.department},{k:'role',l:'Cargo',v:e.role}],d=>api('/api/entity',{kind:'employee',id,...d}))}
function userForm(id){const x=id?by(db.users,id):{};openForm(id?'Editar usuário':'Novo usuário',[...(id?[]:[{k:'username',l:'Nome de usuário (letras minúsculas e números)',v:''}]),{k:'full_name',l:'Nome completo',v:x.full_name},{k:'role',l:'Perfil',v:x.role||'operator',o:Object.entries(RO)},{k:'password',l:id?'Nova senha (deixe em branco para manter)':'Senha (mínimo 8 caracteres)',v:'',r:!id}],d=>api('/api/users',{id,...d}))}
async function tog(k,id){try{await (k==='users'?api('/api/users',{id,toggle:true}):api('/api/entity',{kind:{tools:'tool',boxes:'box',employees:'employee'}[k],id,toggle:true}));await load();render()}catch(x){toast(x.message,1)}}
const lab=t=>`<div class="lab"><b>${esc(t.name)}</b><svg data-c="${t.unique_id}"></svg></div>`;
function fillSvgs(root){root.querySelectorAll('svg[data-c]').forEach(el=>{try{JsBarcode(el,el.dataset.c,{format:'CODE128',width:2,height:40,displayValue:true,fontSize:14,margin:0,textMargin:1});const w=parseFloat(el.getAttribute('width')),h=parseFloat(el.getAttribute('height'));el.setAttribute('viewBox','0 0 '+w+' '+h);el.removeAttribute('width');el.removeAttribute('height');el.style.width='100%';el.style.height='13mm'}catch(e){}})}
function printLabels(ids,start){const n=Math.max(1,Math.min(44,parseInt(start)||1));$('#sheet').innerHTML='<div class="lg">'+'<div class="lab empty"></div>'.repeat(n-1)+ids.map(i=>lab(by(db.tools,i))).join('')+'</div>';fillSvgs($('#sheet'));setTimeout(()=>print(),200)}
function label(id){const t=by(db.tools,id);D.innerHTML=`<h3>Etiqueta ${t.unique_id}</h3><p class="mu">Imprime uma etiqueta pequena (46 x 22 mm) no canto da folha A4. Na mesma folha cabem 44.</p><div class="lg" id="pv">${lab(t)}</div><label style="margin-top:12px">Começar na posição (1 = canto superior esquerdo)<input id="st" type="number" min="1" max="44" value="1"></label><div class="row"><button class="g" onclick="D.close()">Fechar</button><button onclick="printLabels(['${id}'],$('#st').value)">Imprimir</button></div>`;fillSvgs(D);D.showModal()}
function batch(){const T=db.tools.filter(t=>t.active),cs=[...new Set(T.map(t=>t.category))].sort();
 D.innerHTML=`<h3>Imprimir várias etiquetas</h3><div class="bar"><label>Categoria<select id="fc" onchange="bList()"><option value="">Todas</option>${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label><label>Caixa<select id="fb" onchange="bList()"><option value="">Todas</option>${db.boxes.map(b=>`<option value="${b.id}">${esc(b.code)}</option>`).join('')}</select></label></div><div class="bar"><button class="s g" onclick="bAll(1)">Marcar todas</button><button class="s g" onclick="bAll(0)">Desmarcar todas</button><span class="mu" id="bn"></span></div><div id="bl" style="max-height:240px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:8px"></div><label style="margin-top:12px">Começar na posição (para reaproveitar uma folha já usada)<input id="st" type="number" min="1" max="44" value="1"></label><div class="row"><button class="g" onclick="D.close()">Fechar</button><button onclick="bPrint()">Imprimir</button></div>`;bList();D.showModal()}
function bList(){const c=$('#fc').value,b=$('#fb').value;$('#bl').innerHTML=db.tools.filter(t=>t.active&&(!c||t.category===c)&&(!b||t.box_id===b)).map(t=>`<label style="display:flex;gap:8px;align-items:center;margin:0 0 6px;color:var(--tx)"><input type="checkbox" value="${t.id}" checked style="width:auto;margin:0" onchange="bCount()"><b>${t.unique_id}</b> ${esc(t.name)}</label>`).join('')||'<span class="mu">Nenhuma ferramenta.</span>';bCount()}
function bAll(v){document.querySelectorAll('#bl input').forEach(i=>i.checked=!!v);bCount()}
function bCount(){$('#bn').textContent=document.querySelectorAll('#bl input:checked').length+' selecionada(s)'}
function bPrint(){const ids=[...document.querySelectorAll('#bl input:checked')].map(i=>i.value);if(!ids.length)return toast('Marque pelo menos uma ferramenta.',1);printLabels(ids,$('#st').value)}
function exp(k){let r;if(k==='inv')r=[['Código','Nome','Categoria','Marca','Modelo','Conservação','Situação','Caixa'],...db.tools.map(t=>[t.unique_id,t.name,t.category,t.brand,t.model,CO[t.condition][0],ST[t.status][0],by(db.boxes,t.box_id).code])];
 else if(k==='loan')r=[['Código','Ferramenta','Responsável','Matrícula'],...db.tools.filter(t=>t.status==='loaned').map(t=>[t.unique_id,t.name,by(db.employees,t.holder).full_name,by(db.employees,t.holder).registration_code])];
 else r=[['Data','Ferramenta','Funcionário','Tipo','Operador','Detalhes'],...(window._f||[]).map(m=>[fmt(m.timestamp),by(db.tools,m.tool_id).unique_id,by(db.employees,m.employee_id).full_name||'',TY[m.type],by(db.users,m.user_id).username,(m.condition_return?CO[m.condition_return][0]+' ':'')+(m.notes||'')])];
 const s='\ufeff'+r.map(x=>x.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');log('EXPORTAR CSV',k);save();
 D.innerHTML=`<h3>Exportar CSV</h3><p class="mu">Copie o conteúdo e cole em um arquivo .csv ou direto no Excel.</p><textarea id="cv" rows="8" readonly></textarea><div class="row"><button class="g" onclick="D.close()">Fechar</button><button onclick="$('#cv').select();document.execCommand('copy');toast('Copiado.')">Copiar</button></div>`;$('#cv').value=s;D.showModal()}
let _cs=null;
async function cam(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices)return toast('Este navegador não lê código de barras pela câmera. Use o leitor USB ou o Chrome no celular.',1);
 try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});_cs=st;D.innerHTML='<h3>Aponte para a etiqueta</h3><video id="vd" playsinline muted></video><div class="row"><button class="g" onclick="D.close()">Fechar</button></div>';D.onclose=()=>{_cs&&_cs.getTracks().forEach(t=>t.stop());_cs=null};D.showModal();const v=$('#vd');v.srcObject=st;await v.play();const dt=new BarcodeDetector({formats:['code_128']});
 const tick=async()=>{if(!_cs)return;try{const c=await dt.detect(v);if(c.length){const sc=$('#sc');D.close();sc.value=c[0].rawValue;sc.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}));return}}catch(e){}setTimeout(tick,250)};tick()}
 catch(e){toast('Não foi possível acessar a câmera. Verifique a permissão do navegador.',1)}}
init();
</script>
</body>
</html>
